name: Build blog index

# Rebuilds blog.html, feed.xml and the blog section of sitemap.xml whenever an
# article is added, edited or removed in /blog.

on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - 'scripts/build-blog.mjs'
      - 'scripts/blog.template.html'
      - '.github/workflows/build-blog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build blog index
        run: node scripts/build-blog.mjs

      - name: Commit generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog.html feed.xml sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Rebuild blog index [skip ci]"
            git pull --rebase origin main
            git push
          fi
